<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forest Monitor - Dashboard</title>
  <script src="/js/lang.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI', sans-serif; background:#f0f4f0; display:flex; min-height:100vh; }
    .sidebar { width:220px; background:linear-gradient(180deg,#1b4332,#2d6a4f); color:white; padding:20px 0; flex-shrink:0; }
    .sidebar .brand { padding:0 20px 20px; border-bottom:1px solid rgba(255,255,255,0.2); }
    .sidebar .brand h2 { font-size:1.1rem; }
    .sidebar nav a { display:block; padding:12px 20px; color:rgba(255,255,255,0.85); text-decoration:none; font-size:0.9rem; transition:background 0.2s; }
    .sidebar nav a:hover, .sidebar nav a.active { background:rgba(255,255,255,0.15); color:white; }
    .main { flex:1; display:flex; flex-direction:column; }
    .topbar { background:white; padding:15px 25px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
    .topbar h1 { font-size:1.2rem; color:#1b4332; }
    .topbar-right { display:flex; gap:10px; align-items:center; }
    .lang-btn { background:#e8f5e9; border:1px solid #2d6a4f; color:#1b4332; padding:5px 12px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
    .logout-btn { background:#c0392b; color:white; border:none; padding:8px 16px; border-radius:6px; cursor:pointer; font-size:0.85rem; }
    .content { padding:25px; flex:1; }
    .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:20px; margin-bottom:30px; }
    .stat-card { background:white; padding:20px; border-radius:10px; box-shadow:0 2px 8px rgba(0,0,0,0.07); text-align:center; }
    .stat-card .number { font-size:2rem; font-weight:700; color:#2d6a4f; }
    .stat-card .label { font-size:0.85rem; color:#666; margin-top:5px; }
    .panels { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .panel { background:white; border-radius:10px; padding:20px; box-shadow:0 2px 8px rgba(0,0,0,0.07); }
    .panel h3 { margin-bottom:15px; color:#1b4332; font-size:1rem; }
    .alert-item { padding:10px; border-left:4px solid #e74c3c; background:#fdf0f0; border-radius:4px; margin-bottom:8px; font-size:0.85rem; }
    .reading-item { padding:8px 10px; border-bottom:1px solid #f0f0f0; font-size:0.85rem; color:#444; }
  </style>
</head>
<body>
<div class="sidebar">
  <div class="brand"><h2>🌲 Forest Monitor</h2></div>
  <nav>
    <a href="dashboard.html" class="active" data-i18n="nav_dashboard">Dashboard</a>
    <a href="zones.html" data-i18n="nav_zones">Zones</a>
    <a href="sensors.html" data-i18n="nav_sensors">Sensors</a>
    <a href="alerts.html" data-i18n="nav_alerts">Alerts</a>
    <a href="user-management.html" id="userMgmtLink" style="display:none" data-i18n="nav_users">Users</a>
  </nav>
</div>
<div class="main">
  <div class="topbar">
    <h1 data-i18n="dashboard_title">Dashboard Overview</h1>
    <div class="topbar-right">
      <button class="lang-btn" onclick="toggleLang()">🌐 EN/LV</button>
      <span id="userInfo" style="font-size:0.85rem;color:#555"></span>
      <button class="logout-btn" onclick="logout()" data-i18n="logout">Logout</button>
    </div>
  </div>
  <div class="content">
    <div class="stats-grid">
      <div class="stat-card"><div class="number" id="statZones">-</div><div class="label" data-i18n="stat_zones">Zones</div></div>
      <div class="stat-card"><div class="number" id="statSensors">-</div><div class="label" data-i18n="stat_sensors">Sensors</div></div>
      <div class="stat-card"><div class="number" id="statAlerts">-</div><div class="label" data-i18n="stat_alerts">Unresolved Alerts</div></div>
      <div class="stat-card"><div class="number" id="statReadings">-</div><div class="label" data-i18n="stat_readings">Readings Today</div></div>
    </div>
    <div class="panels">
      <div class="panel">
        <h3 data-i18n="recent_alerts">Recent Alerts</h3>
        <div id="alertsList"></div>
      </div>
      <div class="panel">
        <h3 data-i18n="latest_readings">Latest Readings</h3>
        <div id="readingsList"></div>
      </div>
    </div>
  </div>
</div>
<script>
  const token = localStorage.getItem('forestToken');
  const role = localStorage.getItem('forestRole');
  if (!token) { window.location.href = 'login.html'; }
  if (role === 'SUPERADMIN' || role === 'ADMIN') {
    document.getElementById('userMgmtLink').style.display = 'block';
  }
  fetch('/api/users/me', { headers:{ Authorization:'Bearer '+token } })
    .then(r => { if (!r.ok) { localStorage.clear(); window.location.href='login.html'; } return r.json(); })
    .then(u => { document.getElementById('userInfo').textContent = u.username + ' ('+u.role+')'; })
    .catch(() => { localStorage.clear(); window.location.href='login.html'; });

  async function loadDashboard() {
    try {
      const h = { Authorization:'Bearer '+token };
      const [zones, sensors, alerts, readings] = await Promise.all([
        fetch('/api/forest/zones', {headers:h}).then(r=>r.json()),
        fetch('/api/forest/sensors', {headers:h}).then(r=>r.json()),
        fetch('/api/forest/alerts/unresolved', {headers:h}).then(r=>r.json()),
        fetch('/api/forest/readings', {headers:h}).then(r=>r.json())
      ]);
      document.getElementById('statZones').textContent = zones.length;
      document.getElementById('statSensors').textContent = sensors.length;
      document.getElementById('statAlerts').textContent = alerts.length;
      document.getElementById('statReadings').textContent = readings.length;

      const al = document.getElementById('alertsList');
      if (alerts.length === 0) { al.innerHTML = '<p style="color:#888;font-size:0.85rem">'+t('no_alerts')+'</p>'; }
      else { al.innerHTML = alerts.slice(0,5).map(a=>`<div class="alert-item">${a.message} <br><small>${a.zone?.name||''}</small></div>`).join(''); }

      const rl = document.getElementById('readingsList');
      const latest = readings.slice(-5).reverse();
      if (latest.length === 0) { rl.innerHTML = '<p style="color:#888;font-size:0.85rem">'+t('no_readings')+'</p>'; }
      else { rl.innerHTML = latest.map(r=>`<div class="reading-item">${r.sensor?.name||'Sensor'}: <b>${r.value} ${r.unit||''}</b> <small style="float:right;color:#aaa">${new Date(r.timestamp).toLocaleTimeString()}</small></div>`).join(''); }
    } catch(e) { console.error(e); }
  }

  function logout() { localStorage.clear(); window.location.href='login.html'; }

  function toggleLang() {
    const cur = localStorage.getItem('lang') || 'en';
    localStorage.setItem('lang', cur === 'en' ? 'lv' : 'en');
    applyTranslations();
  }

  loadDashboard();
  applyTranslations();
</script>
</body>
</html>
